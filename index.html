<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Expense & Budget Visualizer</h2>
            <button id="theme-toggle" class="btn-theme">Toggle Dark Mode</button>
        </header>

        <div class="balance-card">
            <h4>TOTAL BALANCE</h4>
            <h1 id="balance">$0.00</h1>
        </div>

        <div class="grid-layout">
            <div class="left-panel">
                <div class="card">
                    <h3>Add Transaction</h3>
                    <form id="form">
                        <div class="form-control">
                            <label for="text">Item Name</label>
                            <input type="text" id="text" placeholder="e.g., Lunch..." required />
                        </div>
                        <div class="form-control">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" placeholder="e.g., 15.50..." step="0.01" required />
                        </div>
                        <div class="form-control">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Fun">Fun</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">Add Transaction</button>
                    </form>
                </div>

                <div class="card">
                    <div class="flex-between">
                        <h3>Transactions</h3>
                        <select id="sort-select">
                            <option value="latest">Latest</option>
                            <option value="amount-desc">Amount (High to Low)</option>
                            <option value="category">Category</option>
                        </select>
                    </div>
                    <ul id="list" class="list">
                    </ul>
                </div>
            </div>

            <div class="right-panel">
                <div class="card">
                    <h3 class="text-center">Spending by Category</h3>
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
